[project]
# The import is samvada and the command samvada. A release stamps its version, <YYYYMMDD>.<N>,
# here and in src/samvada/__init__.py.
name = "samvada"
version = "20261111.2rc3"
description = "Samvada: a voice and the habits of a language tutor for AI agents, offline first"
readme = "README.md"
authors = [
    { name = "Cong Zhang", email = "13283869+congzhangzh@users.noreply.github.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["tts", "text-to-speech", "offline", "piper", "ai-agent", "language-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
# No dependency by default: the voices run as subprocesses in their own environments, and
# the default install cannot reach the network (docs/DESIGN.md 4.3).
dependencies = []

[project.urls]
Homepage = "https://github.com/congzhangzh/samvada"
Source = "https://github.com/congzhangzh/samvada"
Releases = "https://github.com/congzhangzh/samvada/releases"

[project.optional-dependencies]
# edge-tts: only used after `samvada online fallback|always`
online = ["edge-tts>=7"]

[project.scripts]
samvada = "samvada.cli:main"
# The `speak` alias (DESIGN 11) is registered at the migration step, not before: installing it
# now would collide with the bash wrapper that is still in use.

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/samvada"]

[tool.hatch.build.targets.sdist]
include = ["src/samvada", "tests", "release", "README.md", "LICENSE", "pyproject.toml", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
