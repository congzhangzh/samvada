# The release pipeline. A tag v<version> builds, tests and publishes; a manual run
# (workflow_dispatch) does everything except publishing: the dry run before every tag. A manual
# run with publish-voices publishes the voice packages PyPI lacks and nothing else (no bundles),
# so samvada can pin them in its next release (publish.sh --voices).
#
#   test      the suite on every supported Python (fake engines: no audio, no network)
#   build     the wheel and the sdist; on a tag, the tag must equal the package version
#   voices    the voice packages, samvada-voice-<lang> (release/voice_packages.py): built,
#             checked against src/samvada/voice-packages.toml (what `voices add` downloads), then
#             the ones PyPI does not have yet; a version PyPI has must be the same
#   install   a clean install of the built wheel, as a user does it; the voices from the voice
#             package wheels served as the GitHub release serves them, and from the installed
#             packages, both with the network to the Hub closed
#   github-voices  on a tag only: the GitHub release voices-<voice-packages version> with the
#             six wheels (en, zh, ja, fr; en-kokoro and zh-kokoro, GitHub only), made once; a
#             release of that name must hold the same SHA256SUMS
#   pypi      on a tag only: samvada to PyPI through Trusted Publishing (environment pypi, no
#             token), after its voices are on GitHub; no voice package (en and zh wait for
#             PyPI's limit raise, pypi/support#13115 and #13116)
#   pypi-voices  on a manual run with publish-voices only: the new voice packages, nothing else
#   bundle    standalone bundles built and tested on each system (Windows arm64: its engines
#             compiled first, PyPI has no wheel for them there)
#   github    on a tag only: a GitHub release with the wheel, the sdist and the bundles
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish-voices:
        description: "Publish the voice packages PyPI lacks to PyPI (nothing else; no bundles)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3 (no floating v10 tag)
      - run: uv run --python ${{ matrix.python }} --group dev pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      voices: ${{ steps.version.outputs.voices }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3 (no floating v10 tag)
      - id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "voices=$(sed -n 's/^voice-packages = "\(.*\)"$/\1/p' pyproject.toml)" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match the package version $version" >&2
            exit 1
          fi
      - run: uv build --out-dir dist
      - run: ls -l dist && sha256sum dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  voices:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3 (no floating v10 tag)
      - uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/download-cache
          key: voices-${{ hashFiles('src/samvada/voices.lock') }}
      - run: |
          uv run python release/voice_packages.py --out "$RUNNER_TEMP/voice-packages" \
            --cache "$RUNNER_TEMP/download-cache" --pypi-plan voice-upload
          mv "$RUNNER_TEMP"/voice-packages/*/ voice-packages
          ls -l voice-packages voice-upload && cat voice-packages/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: voice-packages
          path: voice-packages
      - uses: actions/upload-artifact@v7
        with:
          name: voice-upload
          path: voice-upload
          if-no-files-found: ignore

  install:
    needs: [build, voices]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: voice-packages
          path: voice-packages
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3 (no floating v10 tag)
      - run: |
          uv venv --python 3.12 /tmp/user
          uv pip install --python /tmp/user/bin/python dist/*.whl
          export PATH=/tmp/user/bin:$PATH HOME=$(mktemp -d)
          samvada version
          samvada voices
          SAMVADA=off samvada speak en "hello"
          samvada status
      - name: the voices from the wheels as the GitHub release serves them, the Hub closed
        run: |
          (cd voice-packages && python3 -m http.server 8765 --bind 127.0.0.1 &) && sleep 1
          export PATH=/tmp/user/bin:$PATH HOME=$(mktemp -d) HF_ENDPOINT=http://127.0.0.1:9 \
            SAMVADA_VOICES_URL=http://127.0.0.1:8765/
          samvada voices add en zh ja fr --engine never
          samvada voices add en zh --kokoro --engine never
          samvada voices verify
      - name: the voices from the installed voice packages, the Hub closed
        run: |
          uv pip install --python /tmp/user/bin/python --no-index --find-links voice-packages \
            samvada-voice-en samvada-voice-zh samvada-voice-ja samvada-voice-fr
          export PATH=/tmp/user/bin:$PATH HOME=$(mktemp -d) HF_ENDPOINT=http://127.0.0.1:9
          samvada voices add en zh ja fr --engine never
          samvada voices verify en zh ja fr

  bundle:
    needs: test
    if: ${{ !inputs.publish-voices }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, plat: linux-x86_64, test: --test }
          - { os: ubuntu-24.04-arm, plat: linux-arm64, test: --test }
          - { os: macos-15, plat: macos-arm64, test: --test-local }
          - { os: windows-2025, plat: windows-x86_64, test: --test-local }
          # native: piper-tts, pyopenjtalk-plus and sudachipy compiled here (build_wheels.py)
          - { os: windows-11-arm, plat: windows-arm64, test: --test-local, wheels: true,
              python: cpython-3.12-windows-aarch64-none }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # the runner context exists only inside steps, so the build folder is set here
      - run: echo "SAMVADA_BUILD_DIR=$RUNNER_TEMP/samvada-build" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3 (no floating v10 tag)
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/samvada-build/download-cache
          key: voices-${{ hashFiles('src/samvada/voices.lock') }}
      # the compilers for the engines PyPI has no wheel for: MSVC's ARM64 tools, Rust
      - if: matrix.wheels
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - if: matrix.wheels
        run: |
          if ! command -v cargo >/dev/null; then
            curl -sSfL -o "$RUNNER_TEMP/rustup-init.exe" \
              https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe
            "$RUNNER_TEMP/rustup-init.exe" -y --profile minimal
            echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - if: matrix.wheels
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/samvada-build/wheelhouse
          # only the engines compiled here (piper, piper-plus): the Kokoro lock is not in a bundle,
          # and a key that moved with it forced a fresh compile, which today's MSVC breaks on
          # espeak-ng (C7780 __has_include_next; 20261117.2's dry run)
          key: wheels-${{ matrix.plat }}-${{ hashFiles('src/samvada/locks/piper*.txt', 'release/build_wheels.py') }}
      # pwsh, not bash: Git Bash puts its /usr/bin first, and its link.exe (coreutils) then
      # shadows MSVC's linker (rc1: Rust linked with C:\Program Files\Git\usr\bin\link.exe)
      - if: matrix.wheels
        shell: pwsh
        run: |
          # short paths: Windows' 260-character limit (rc2: CMake objects under pip's temp)
          New-Item -ItemType Directory -Force C:\t | Out-Null
          $env:TEMP = "C:\t"; $env:TMP = "C:\t"
          (Get-Command link.exe).Source
          rustc -vV | Select-String host
          uv run --python ${{ matrix.python }} python release/build_wheels.py --src C:\s `
            --out "$env:SAMVADA_BUILD_DIR/wheelhouse"
      - env:
          WHEELHOUSE: ${{ matrix.wheels && format('--wheelhouse={0}/samvada-build/wheelhouse', runner.temp) || '' }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          uv run --python ${{ matrix.python || '3.12' }} python release/bundle.py "$version" \
            ${{ matrix.test }} $WHEELHOUSE
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.plat }}
          path: ${{ runner.temp }}/samvada-build/bundles/samvada-*
          compression-level: 0

  github-voices:
    needs: [voices, install]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: voice-packages
          path: voice-packages
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vp=$(jq -r .version voice-packages/voice-packages.json)
          tag="voices-$vp"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --output theirs
            if cmp -s theirs voice-packages/SHA256SUMS; then
              echo "$tag is on GitHub with the same SHA256SUMS"; exit 0
            fi
            echo "$tag on GitHub differs from this build; bump [tool.samvada] voice-packages" >&2
            diff theirs voice-packages/SHA256SUMS >&2; exit 1
          fi
          cat > notes.md <<EOF
          The voices of samvada, one voice package wheel per language (data only, the files
          byte for byte as pinned in samvada's voices.lock). samvada voices add <lang>
          downloads the language's wheel from here, checks it and installs the voice, so you
          don't need to fetch these yourself. Each voice keeps its own terms: see the README
          inside its wheel.
          EOF
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "samvada voices $vp" --notes-file notes.md --latest=false \
            voice-packages/*.whl voice-packages/SHA256SUMS

  pypi:
    needs: [build, install, github-voices]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/samvada/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # Trusted Publishing: no token is stored anywhere
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  pypi-voices:
    needs: [voices, install]
    if: github.event_name == 'workflow_dispatch' && inputs.publish-voices
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/user/congzhangzh/
    permissions:
      id-token: write # Trusted Publishing: each voice project has this workflow's publisher
    steps:
      - uses: actions/download-artifact@v8
        continue-on-error: true  # no artifact: PyPI has every voice package of this version
        with:
          name: voice-upload
          path: voice-upload
      - id: voices
        run: |
          echo "count=$(ls voice-upload/*.whl 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"
          ls -l voice-upload 2>/dev/null || echo "PyPI has every voice package of this version"
      - if: steps.voices.outputs.count != '0'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: voice-upload

  github:
    needs: [build, pypi, bundle]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v8
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          VOICES: ${{ needs.build.outputs.voices }}
        run: |
          cat > notes.md <<EOF
          pip install samvada==$VERSION   (or: uv tool install samvada)
          samvada voices add en zh ja fr   (the languages you want)
          Each voice comes from its wheel on the release voices-$VOICES, checked against
          samvada's voices.lock; if GitHub fails, from Hugging Face, file by file. Each voice
          keeps its own terms (VOICES.md, or the README inside its wheel).

          Standalone bundles: their own Python, both engines and the English, Chinese, Japanese
          and French voices; no network needed. Unpack, then run bin/samvada (Windows:
          bin\\samvada.cmd).
          linux-x86_64, linux-arm64, macos-arm64 (macOS 14+), windows-x86_64, windows-arm64
          (native). VOICES.md inside lists each voice's
          source; each voice keeps its own license.
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "samvada $VERSION" --notes-file notes.md dist/*
