# The release pipeline. A tag v<version> builds, tests and publishes; a manual run
# (workflow_dispatch) does everything except publishing: the dry run before every tag.
#
#   test      the suite on every supported Python (fake engines: no audio, no network)
#   build     the wheel and the sdist; on a tag, the tag must equal the package version
#   install   a clean install of the built wheel, as a user does it
#   pypi      on a tag only: PyPI through Trusted Publishing (environment pypi, no token)
#   bundle    standalone bundles built and tested on each system (Windows arm64: its engines
#             compiled first, PyPI has no wheel for them there)
#   github    on a tag only: a GitHub release with the wheel, the sdist and the bundles
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv run --python ${{ matrix.python }} --group dev pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match the package version $version" >&2
            exit 1
          fi
      - run: uv build --out-dir dist
      - run: ls -l dist && sha256sum dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  install:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@v10
      - run: |
          uv venv --python 3.12 /tmp/user
          uv pip install --python /tmp/user/bin/python dist/*.whl
          export PATH=/tmp/user/bin:$PATH HOME=$(mktemp -d)
          samvada version
          samvada voices
          SAMVADA=off samvada speak en "hello"
          samvada status

  bundle:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, plat: linux-x86_64, test: --test }
          - { os: ubuntu-24.04-arm, plat: linux-arm64, test: --test }
          - { os: macos-15, plat: macos-arm64, test: --test-local }
          - { os: windows-2025, plat: windows-x86_64, test: --test-local }
          # native: piper-tts, pyopenjtalk-plus and sudachipy compiled here (build_wheels.py)
          - { os: windows-11-arm, plat: windows-arm64, test: --test-local, wheels: true,
              python: cpython-3.12-windows-aarch64-none }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # the runner context exists only inside steps, so the build folder is set here
      - run: echo "SAMVADA_BUILD_DIR=$RUNNER_TEMP/samvada-build" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/samvada-build/download-cache
          key: voices-${{ hashFiles('src/samvada/voices.lock') }}
      # the compilers for the engines PyPI has no wheel for: MSVC's ARM64 tools, Rust
      - if: matrix.wheels
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - if: matrix.wheels
        run: |
          if ! command -v cargo >/dev/null; then
            curl -sSfL -o "$RUNNER_TEMP/rustup-init.exe" \
              https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe
            "$RUNNER_TEMP/rustup-init.exe" -y --profile minimal
            echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - if: matrix.wheels
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/samvada-build/wheelhouse
          key: wheels-${{ matrix.plat }}-${{ hashFiles('src/samvada/locks/*.txt', 'release/build_wheels.py') }}
      # pwsh, not bash: Git Bash puts its /usr/bin first, and its link.exe (coreutils) then
      # shadows MSVC's linker (rc1: Rust linked with C:\Program Files\Git\usr\bin\link.exe)
      - if: matrix.wheels
        shell: pwsh
        run: |
          # short paths: Windows' 260-character limit (rc2: CMake objects under pip's temp)
          New-Item -ItemType Directory -Force C:\t | Out-Null
          $env:TEMP = "C:\t"; $env:TMP = "C:\t"
          (Get-Command link.exe).Source
          rustc -vV | Select-String host
          uv run --python ${{ matrix.python }} python release/build_wheels.py --src C:\s `
            --out "$env:SAMVADA_BUILD_DIR/wheelhouse"
      - env:
          WHEELHOUSE: ${{ matrix.wheels && format('--wheelhouse={0}/samvada-build/wheelhouse', runner.temp) || '' }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          uv run --python ${{ matrix.python || '3.12' }} python release/bundle.py "$version" \
            ${{ matrix.test }} $WHEELHOUSE
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.plat }}
          path: ${{ runner.temp }}/samvada-build/bundles/samvada-*
          compression-level: 0

  pypi:
    needs: [build, install]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/samvada/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # Trusted Publishing: no token is stored anywhere
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github:
    needs: [build, pypi, bundle]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v8
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cat > notes.md <<EOF
          pip install samvada==$VERSION   (then: samvada voices add en zh)

          Standalone bundles: their own Python, both engines and the English, Chinese, Japanese
          and French voices; no network needed. Unpack, then run bin/samvada (Windows:
          bin\\samvada.cmd).
          linux-x86_64, linux-arm64, macos-arm64 (macOS 14+), windows-x86_64, windows-arm64
          (native). VOICES.md inside lists each voice's
          source; each voice keeps its own license.
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "samvada $VERSION" --notes-file notes.md dist/*
